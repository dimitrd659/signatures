<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sky Partners Signature</title>
</head>

<body style="margin:0;padding:0;background:#ffffff;">

<table cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#ffffff;">
<tr>
<td align="left">

<table cellpadding="0" cellspacing="0" border="0" width="360"
style="width:360px;max-width:360px;font-family:'Segoe UI',Arial,sans-serif;color:#1d1d1f;">

    <!-- NAME -->
    <tr>
        <td style="font-size:22px;font-weight:700;padding:5px 0 2px 0;">
            Име Фамилия
        </td>
    </tr>

    <!-- POSITION -->
    <tr>
        <td style="font-size:13px;color:#6B7280;padding-bottom:10px;">
            System Administrator
        </td>
    </tr>

    <!-- LINE -->
    <tr>
        <td style="padding-bottom:12px;">
            <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                    <td height="2" bgcolor="#0057D9"
                        style="height:2px;font-size:0;line-height:0;">
                        &nbsp;
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- PHONE -->
    <tr>
        <td style="font-size:13px;line-height:18px;padding-bottom:4px;">
            +359 XXX XXX XXX
        </td>
    </tr>

    <!-- EMAIL -->
    <tr>
        <td style="font-size:13px;line-height:18px;padding-bottom:4px;">
            name@sky-partners.com
        </td>
    </tr>

    <!-- ADDRESS -->
    <tr>
        <td style="font-size:13px;line-height:18px;padding-bottom:14px;">
            Sofia, Bulgaria
        </td>
    </tr>

    <!-- ICONS -->
    <tr>
        <td align="left">

            <!-- Website -->
            <a href="https://www.sky-partners.com/"
               style="text-decoration:none;">
                <img src="https://skypartners.b-cdn.net/signatures/website.png"
                     width="20"
                     height="20"
                     alt="Website"
                     border="0"
                     style="display:inline-block;vertical-align:middle;border:0;">
            </a>

            &nbsp;&nbsp;

            <!-- X -->
            <a href="#"
               style="text-decoration:none;">
                <img src="https://skypartners.b-cdn.net/signatures/x.png"
                     width="20"
                     height="20"
                     alt="X"
                     border="0"
                     style="display:inline-block;vertical-align:middle;border:0;">
            </a>

            &nbsp;&nbsp;

            <!-- Facebook -->
            <a href="#"
               style="text-decoration:none;">
                <img src="https://skypartners.b-cdn.net/signatures/facebook.png"
                     width="20"
                     height="20"
                     alt="Facebook"
                     border="0"
                     style="display:inline-block;vertical-align:middle;border:0;">
            </a>

            &nbsp;&nbsp;

            <!-- Instagram -->
            <a href="#"
               style="text-decoration:none;">
                <img src="https://skypartners.b-cdn.net/signatures/instagram.png"
                     width="20"
                     height="20"
                     alt="Instagram"
                     border="0"
                     style="display:inline-block;vertical-align:middle;border:0;">
            </a>

            &nbsp;&nbsp;

            <!-- LinkedIn -->
            <a href="#"
               style="text-decoration:none;">
                <img src="https://skypartners.b-cdn.net/signatures/linkedin.png"
                     width="20"
                     height="20"
                     alt="LinkedIn"
                     border="0"
                     style="display:inline-block;vertical-align:middle;border:0;">
            </a>

        </td>
    </tr>

    <!-- SPACE -->
    <tr>
        <td style="height:16px;font-size:0;line-height:0;">
            &nbsp;
        </td>
    </tr>

    <!-- BLACK BANNER -->
    <tr>
        <td>
            <a href="https://www.sky-partners.com/"
               style="text-decoration:none;">

                <img src="https://skypartners.b-cdn.net/signatures/banner_black.png"
                     alt="Sky Partners"
                     border="0"
                     style="display:block;width:360px;max-width:360px;height:135px;">

            </a>
        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
